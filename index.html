<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades de Medida en CSS</title>
    <style>
        h1{font-size: 0..5in;
        color: blue;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 3px 3px 5px black;}

        #caja{width: 100vw;
        height: 100vh;
        background-color: bisque;}

        p{font-size: 1.5em;
        text-align: justify;
        letter-spacing: 5px;
        line-height: 2;}
        
        #titulo{background-color: aquamarine;
        width: 50%; 
        box-shadow: 3px 3px 3px black;}
        
        a{text-decoration: none;}

    </style>
</head>
<body>
    <a href="http://www.iesjuanbosco.es">IES Juan Bosco</a>
    <div id="caja">
      <div id="titulo">
          Esto es una subcaja
      </div>
      <h1>Unidades de Medida en CSS</h1>
      <p>A diferencia de HTML, en CSS se puede indicar el tamaño de los elementos con distintas unidades.Por ejemplo:centimetros, milímetros, puntos y pixeles</p>
    </div>
</body>
</html>
